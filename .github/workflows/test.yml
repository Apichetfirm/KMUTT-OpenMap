name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax and data integrity
        run: npm run check && npm run validate-data
      - name: Unit and map integration tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser fixtures
        run: npm run test:e2e
      - name: Stage GitHub Pages assets
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
