name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    # Ubuntu 24.04 AppArmor blocks the downloaded Chromium user-namespace sandbox.
    # Use the supported 22.04 image; keep the browser sandbox enabled.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax and data integrity
        run: npm run verify-vendor && npm run check && npm run validate-data
      - name: Unit and map integration tests
        run: npm test
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Audit offline image dependency
        run: python -m pip install -r scripts/requirements-images.txt pip-audit==2.10.1 && python -m pip_audit --strict -r scripts/requirements-images.txt
      - name: Offline image tools
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Desktop/mobile and Firefox/WebKit browser fixtures
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MOZ_WEBRENDER: '1'
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Stage GitHub Pages assets
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
