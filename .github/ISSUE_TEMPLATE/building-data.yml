name: Incorrect or missing building data
description: Report a building name, location, height, or entrance problem
labels: [data]
body:
  - type: input
    id: building
    attributes:
      label: Building code or name
      placeholder: N9 / FIBO
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and source URL (or survey date)
      description: Do not include private information, unpublished security maps, or photos without permission.
    validations:
      required: true
